<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Unsere Spielewelten</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#314238;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f6ed}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:4px solid #da9a24;outline-offset:5px}[hidden]{display:none!important}
#selection{max-width:1250px;margin:auto;padding:clamp(24px,5vw,64px) 24px 40px;text-align:center}.eyebrow{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#697863;font-weight:750}h1{font-size:clamp(30px,4vw,52px);line-height:1.12;margin:16px 0}.intro{font-size:20px;color:#687064;margin:0 0 36px}.worlds{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.world{padding:0;border:0;border-radius:26px;overflow:hidden;text-align:left;background:white;color:inherit;box-shadow:0 9px 30px #35412414;transition:transform .18s,box-shadow .18s}.world:hover{transform:translateY(-5px);box-shadow:0 15px 35px #35412425}.world img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.world .copy{padding:24px;display:block}.label{display:block;color:var(--accent);font-size:14px;font-weight:800;margin-bottom:12px}.question{display:block;font-size:clamp(22px,2.4vw,29px);font-weight:750;line-height:1.25;min-height:3.8em}.go{display:inline-block;color:var(--accent);font-weight:800;margin-top:20px}footer{margin-top:32px;color:#697863;font-size:15px}
#gameHeader{height:64px;padding:8px max(16px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fffdf8;border-bottom:1px solid #e3e5d9}#back{border:0;background:#eaf0e1;padding:11px 16px;border-radius:14px;font-weight:750;color:#314238}#gameTitle{font-size:18px;font-weight:750}iframe{display:block;width:100%;height:calc(100dvh - 64px);border:0;background:#e6edcf}#game{position:fixed;inset:0;background:#e6edcf;z-index:5}
@media(max-width:760px){.worlds{grid-template-columns:1fr;gap:20px}.world{display:grid;grid-template-columns:40% 60%}.world img{height:100%;min-height:205px;aspect-ratio:auto}.world .copy{padding:20px}.question{font-size:23px;min-height:0}.go{margin-top:16px}#selection{padding:28px 16px}.intro{font-size:18px;margin-bottom:26px}#gameTitle{font-size:14px}}@media(prefers-reduced-motion:reduce){.world{transition:none}.world:hover{transform:none}}
</style></head><body>
<main id="selection"><div class="eyebrow">Gemeinsam lesen · gemeinsam spielen</div><h1>Was möchtest du heute erleben?</h1><p class="intro">Wähle deine Spielewelt.</p><div class="worlds"><button class="world" data-world="abenteuer" style="--accent:#3d7656"><img id="image-abenteuer" alt=""/><span class="copy"><span class="label">🌳 Freizeit & Abenteuer</span><span class="question">Hast du Lust auf ein Abenteuer?</span><span class="go">Los geht’s →</span></span></button><button class="world" data-world="sport" style="--accent:#3872a4"><img id="image-sport" alt=""/><span class="copy"><span class="label">⚽ Sport & Spiel</span><span class="question">Möchtest du etwas mit Sport spielen?</span><span class="go">Los geht’s →</span></span></button><button class="world" data-world="maerchen" style="--accent:#9364a8"><img id="image-maerchen" alt=""/><span class="copy"><span class="label">✨ Märchen & Zauber</span><span class="question">Wie wäre es mit einem Märchen?</span><span class="go">Los geht’s →</span></span></button></div><footer>Drei Welten für eure gemeinsame Spielzeit.</footer></main>
<section id="game" hidden><header id="gameHeader"><button id="back">← Spiel wechseln</button><span id="gameTitle"></span></header><div id="frameHost"></div></section>
<script>
const games=[{"id":"abenteuer","title":"Freizeit & Abenteuer","question":"Hast du Lust auf ein Abenteuer?","icon":"🌳","color":"#3d7656","src":"spiele/abenteuer.html","preview":"bilder/abenteuer.png"},{"id":"sport","title":"Sport & Spiel","question":"Möchtest du etwas mit Sport spielen?","icon":"⚽","color":"#3872a4","src":"spiele/sport.html","preview":"bilder/sport.png"},{"id":"maerchen","title":"Märchen & Zauber","question":"Wie wäre es mit einem Märchen?","icon":"✨","color":"#9364a8","src":"spiele/maerchen.html","preview":"bilder/maerchen.png"}],selection=document.getElementById('selection'),game=document.getElementById('game'),host=document.getElementById('frameHost');
for(const g of games)document.getElementById('image-'+g.id).src=g.preview;
let selected=null;
document.querySelectorAll('[data-world]').forEach(button=>button.addEventListener('click',()=>{
 selected=button;const g=games.find(g=>g.id===button.dataset.world);const frame=document.createElement('iframe');frame.title=g.title;frame.src=g.src;host.replaceChildren(frame);document.getElementById('gameTitle').textContent=g.title;selection.hidden=true;game.hidden=false;document.getElementById('back').focus();
}));
document.getElementById('back').addEventListener('click',()=>{if(!confirm('Zur Spieleauswahl zurück? Das laufende Spiel wird beendet.'))return;host.replaceChildren();game.hidden=true;selection.hidden=false;selected?.focus();});
</script></body></html>
