name: Remove weekday highlights once
on:
  push:
    paths:
      - ".github/workflows/remove-weekday-highlights-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove visual weekday highlighting only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("sport.html")
          s = p.read_text(encoding="utf-8")
          old = '#board.cardMode .weekdayHit { display:block; outline:4px solid rgba(255,235,59,.82); outline-offset:-4px; animation:wdayPulse 1.1s ease-in-out infinite alternate; }'
          new = '#board.cardMode .weekdayHit { display:block; outline:none; outline-offset:0; animation:none; box-shadow:none; }'
          if s.count(old) != 1:
              raise SystemExit(f"Expected exactly one target rule, found {s.count(old)}")
          p.write_text(s.replace(old, new), encoding="utf-8")
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sport.html
          git diff --cached --quiet && exit 0
          git commit -m "Wochentags-Markierungen im Sport-Spiel ausblenden"
          git push
